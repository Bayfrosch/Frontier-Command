name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  GODOT_VERSION: 4.7.2
  GDUNIT_VERSION: 6.2.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore "Frontier Command.csproj"
      - run: dotnet build "Frontier Command.csproj" --no-restore --warnaserror

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore "Frontier Command.csproj"
      - run: dotnet format "Frontier Command.csproj" --no-restore --verify-no-changes --severity warn --exclude addons

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install virtual display and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1-mesa-dri libglx-mesa0 libxinerama1 libxcursor1 libxi6 libxrandr2 libasound2t64
      - name: Install Godot .NET and GdUnit4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            "https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/v${GDUNIT_VERSION}.zip" \
            --output "$RUNNER_TEMP/gdunit.zip"
          unzip -q "$RUNNER_TEMP/gdunit.zip" -d "$RUNNER_TEMP/gdunit"
          mkdir -p addons
          cp -r "$RUNNER_TEMP/gdunit/gdUnit4-${GDUNIT_VERSION}/addons/gdUnit4" addons/gdUnit4
      - name: Compile project and test bridge
        run: dotnet build "Frontier Command.csproj" --warnaserror
      - name: Import Godot resources
        run: Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 --headless --editor --path . --import
      - name: Run all tests
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
          --path . --rendering-method gl_compatibility --audio-driver Dummy
          -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd
          -a res://__tests__ -c -rd reports
      - name: Verify test discovery
        run: find reports -name results.xml -type f -print -quit | grep -q .
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14
